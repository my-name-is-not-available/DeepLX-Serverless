main:
  push:
    - imports:
        - https://cnb.cool/Zecrimp/secret/-/blob/main/.github.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/my-name-is-not-available/DeepLX-Serverless.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}